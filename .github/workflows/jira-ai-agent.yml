name: Jira AI Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jira-ai-agent
  cancel-in-progress: false

jobs:
  jira-ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}


      # ============================================================
      # 2. FIND JIRA TASK + CHECK WHETHER AI AGENT IS BUSY
      # ============================================================

      - name: Fetch Jira task and prepare agent
        id: prepare
        env:
          ATLASSIAN_MCP_API_KEY: ${{ secrets.ATLASSIAN_MCP_API_KEY }}
          JIRA_CLOUD_ID: "79478d62-55e6-4f8a-9774-9ca35ff386c3"
          GH_TOKEN: ${{ github.token }}
          REPO: "Vishalkeyss/ChamberAI"
          BASE_BRANCH: "vishal_test"
          AI_BRANCH: "ai-agent"
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "          JIRA AI AGENT"
          echo "======================================"
          echo ""

          if [ -z "${ATLASSIAN_MCP_API_KEY:-}" ]; then
            echo "ERROR: ATLASSIAN_MCP_API_KEY secret is missing."
            exit 1
          fi

          MCP_DIR="${RUNNER_TEMP}/mcp-jira-client"

          mkdir -p "$MCP_DIR"
          cd "$MCP_DIR"

          npm init -y >/dev/null 2>&1
          npm install @modelcontextprotocol/client >/dev/null 2>&1

          cat > "$MCP_DIR/jira.mjs" <<'NODE'
          import {
            Client,
            StreamableHTTPClientTransport
          } from "@modelcontextprotocol/client";

          import fs from "node:fs";

          const token = process.env.ATLASSIAN_MCP_API_KEY;
          const cloudId = process.env.JIRA_CLOUD_ID;
          const repo = process.env.REPO;
          const baseBranch = process.env.BASE_BRANCH;
          const aiBranch = process.env.AI_BRANCH;

          const client = new Client(
            {
              name: "github-actions-jira-ai-agent",
              version: "1.0.0"
            },
            {
              versionNegotiation: {
                mode: "auto"
              }
            }
          );

          const transport = new StreamableHTTPClientTransport(
            new URL("https://mcp.atlassian.com/v2/mcp"),
            {
              requestInit: {
                headers: {
                  Authorization: `Bearer ${token}`
                }
              }
            }
          );

          async function githubRequest(path, options = {}) {
            const response = await fetch(
              `https://api.github.com${path}`,
              {
                ...options,
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                  ...(options.headers || {})
                }
              }
            );

            return response;
          }

          async function main() {
            await client.connect(transport);

            const tools = await client.listTools();

            const searchTool = tools.tools.find(
              tool => tool.name === "searchJiraIssuesUsingJql"
            );

            const transitionTool = tools.tools.find(
              tool => tool.name === "transitionJiraIssue"
            );

            if (!searchTool) {
              throw new Error(
                "searchJiraIssuesUsingJql is unavailable."
              );
            }

            if (!transitionTool) {
              throw new Error(
                "transitionJiraIssue is unavailable."
              );
            }

            // --------------------------------------------------------
            // SEARCH JIRA
            // --------------------------------------------------------

            console.log("");
            console.log("Searching Jira...");

            const searchResult = await client.callTool({
              name: "searchJiraIssuesUsingJql",
              arguments: {
                cloudId,

                jql:
                  'project = KAN AND labels = "ai-ready" AND status = "To Do" ORDER BY created ASC',

                searchResultMode: "issues",

                maxResults: 10,

                fields: [
                  "summary",
                  "status",
                  "labels",
                  "description"
                ],

                responseContentFormat: "markdown",

                view: "evidence"
              }
            });

            if (searchResult.isError) {
              throw new Error("Jira search failed.");
            }

            const jsonPart = (searchResult.content ?? []).find(
              item =>
                item.type === "text" &&
                item.text &&
                item.text.trim().startsWith("{")
            );

            if (!jsonPart) {
              throw new Error(
                "No JSON payload returned by Jira MCP."
              );
            }

            const response = JSON.parse(jsonPart.text);

            const issues =
              response?.issues ??
              response?.data?.issues ??
              [];

            console.log(
              `Tasks found: ${issues.length}`
            );

            if (issues.length === 0) {
              console.log(
                "No ai-ready Jira tasks waiting."
              );
              return;
            }

            const issue = issues[0];

            const issueKey = issue.key;

            const summary =
              issue.fields?.summary ??
              "Unknown";

            const description =
              typeof issue.fields?.description === "string"
                ? issue.fields.description
                : JSON.stringify(
                    issue.fields?.description ?? "No description",
                    null,
                    2
                  );

            console.log("");
            console.log("======================================");
            console.log("             TASK SELECTED");
            console.log("======================================");
            console.log(`Issue: ${issueKey}`);
            console.log(`Summary: ${summary}`);
            console.log("");

            // --------------------------------------------------------
            // CHECK WHETHER AI AGENT ALREADY HAS AN OPEN PR
            // --------------------------------------------------------

            console.log(
              "Checking whether AI agent is busy..."
            );

            const prResponse = await githubRequest(
              `/repos/${repo}/pulls?state=open&base=${encodeURIComponent(
                baseBranch
              )}&head=Vishalkeyss:${encodeURIComponent(
                aiBranch
              )}&per_page=10`
            );

            if (!prResponse.ok) {
              throw new Error(
                `GitHub PR lookup failed: ${prResponse.status}`
              );
            }

            const prs = await prResponse.json();

            if (Array.isArray(prs) && prs.length > 0) {
              console.log("");
              console.log("======================================");
              console.log("          AI AGENT IS BUSY");
              console.log("======================================");

              for (const pr of prs) {
                console.log(
                  `PR #${pr.number}: ${pr.title}`
                );
                console.log(pr.html_url);
              }

              console.log("");
              console.log(
                "Leaving Jira task in To Do."
              );
              console.log(
                "It will be picked up after the current PR is merged."
              );

              return;
            }

            console.log("");
            console.log("AI agent is free.");

            // --------------------------------------------------------
            // GET CURRENT BASE BRANCH SHA
            // --------------------------------------------------------

            console.log(
              `Checking ${baseBranch}...`
            );

            const baseResponse = await githubRequest(
              `/repos/${repo}/git/ref/heads/${encodeURIComponent(
                baseBranch
              )}`
            );

            if (!baseResponse.ok) {
              throw new Error(
                `Could not find ${baseBranch}: ${baseResponse.status}`
              );
            }

            const baseData = await baseResponse.json();

            const baseSha = baseData.object.sha;

            console.log(
              `${baseBranch} SHA: ${baseSha}`
            );

            // --------------------------------------------------------
            // CREATE OR RESET AI BRANCH
            //
            // ai-agent is an automation-owned permanent branch.
            // Since there is no open PR, it is safe to synchronize it
            // to the latest vishal_test before starting a new task.
            // --------------------------------------------------------

            const aiResponse = await githubRequest(
              `/repos/${repo}/git/ref/heads/${encodeURIComponent(
                aiBranch
              )}`
            );

            if (aiResponse.status === 404) {
              console.log(
                `${aiBranch} does not exist.`
              );

              console.log(
                `Creating ${aiBranch} from ${baseBranch}...`
              );

              const createResponse = await githubRequest(
                `/repos/${repo}/git/refs`,
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    ref: `refs/heads/${aiBranch}`,
                    sha: baseSha
                  })
                }
              );

              if (!createResponse.ok) {
                const errorText =
                  await createResponse.text();

                throw new Error(
                  `Failed to create ${aiBranch}: ${createResponse.status} ${errorText}`
                );
              }

              console.log(
                `${aiBranch} created successfully.`
              );
            } else if (!aiResponse.ok) {
              throw new Error(
                `Could not inspect ${aiBranch}: ${aiResponse.status}`
              );
            } else {
              const aiData = await aiResponse.json();

              const aiSha = aiData.object.sha;

              console.log(
                `${aiBranch} current SHA: ${aiSha}`
              );

              if (aiSha !== baseSha) {
                console.log(
                  `${aiBranch} is not at ${baseBranch}.`
                );

                console.log(
                  `Synchronizing ${aiBranch} → ${baseBranch}...`
                );

                const updateResponse = await githubRequest(
                  `/repos/${repo}/git/refs/heads/${encodeURIComponent(
                    aiBranch
                  )}`,
                  {
                    method: "PATCH",
                    headers: {
                      "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                      sha: baseSha,
                      force: true
                    })
                  }
                );

                if (!updateResponse.ok) {
                  const errorText =
                    await updateResponse.text();

                  throw new Error(
                    `Failed to synchronize ${aiBranch}: ${updateResponse.status} ${errorText}`
                  );
                }

                console.log(
                  `${aiBranch} synchronized successfully.`
                );
              } else {
                console.log(
                  `${aiBranch} is already synchronized.`
                );
              }
            }

            // --------------------------------------------------------
            // MOVE JIRA → IN PROGRESS
            // --------------------------------------------------------

            console.log("");
            console.log(
              `Moving ${issueKey} → In Progress...`
            );

            try {
              let targetTransitionId = "21"; // default fallback

              const transitionsRes = await client.callTool({
                name: "getTransitionsForJiraIssue",
                arguments: {
                  cloudId,
                  issueIdOrKey: issueKey
                }
              }).catch(() => null);

              if (transitionsRes && !transitionsRes.isError) {
                const trJson = (transitionsRes.content ?? []).find(
                  item => item.type === "text" && item.text && item.text.trim().startsWith("{")
                );
                if (trJson) {
                  try {
                    const trData = JSON.parse(trJson.text);
                    const transitionsList = trData.transitions || trData.data?.transitions || [];
                    console.log(
                      "Available transitions:",
                      transitionsList.map(t => `${t.id}: ${t.name}`).join(", ")
                    );
                    const inProgressTr = transitionsList.find(t =>
                      t.name?.toLowerCase().includes("progress") ||
                      t.to?.name?.toLowerCase().includes("progress")
                    );
                    if (inProgressTr) {
                      targetTransitionId = inProgressTr.id;
                    }
                  } catch (e) {
                    console.log("Could not parse transitions:", e.message);
                  }
                }
              }

              const transitionResult = await client.callTool({
                name: "transitionJiraIssue",
                arguments: {
                  cloudId,
                  issueIdOrKey: issueKey,
                  transition: {
                    id: targetTransitionId
                  }
                }
              });

              if (transitionResult.isError) {
                console.log(
                  `Warning: Jira transition to In Progress returned an error:`,
                  JSON.stringify(transitionResult.content)
                );
                console.log(
                  `Continuing anyway since task ${issueKey} was found and selected.`
                );
              } else {
                console.log(
                  `${issueKey} moved to In Progress (transition id: ${targetTransitionId}).`
                );
              }
            } catch (transitionErr) {
              console.log(
                `Warning moving ${issueKey} to In Progress: ${transitionErr.message}`
              );
              console.log(
                `Continuing with agent execution.`
              );
            }

            // --------------------------------------------------------
            // OUTPUT DATA TO GITHUB ACTIONS
            // --------------------------------------------------------

            const output = process.env.GITHUB_OUTPUT;

            const summaryBase64 =
              Buffer.from(
                summary,
                "utf8"
              ).toString("base64");

            const descriptionBase64 =
              Buffer.from(
                description,
                "utf8"
              ).toString("base64");

            fs.appendFileSync(
              output,
              `issue_key=${issueKey}\n`
            );

            fs.appendFileSync(
              output,
              `summary_b64=${summaryBase64}\n`
            );

            fs.appendFileSync(
              output,
              `description_b64=${descriptionBase64}\n`
            );

            console.log("");
            console.log("======================================");
            console.log("        TASK LOCKED FOR AI");
            console.log("======================================");
            console.log(`Issue: ${issueKey}`);
            console.log("Jira status: In Progress");
            console.log(`AI branch: ${aiBranch}`);
          }

          try {
            await main();
          } finally {
            await client.close().catch(() => {});
          }
          NODE

          node "$MCP_DIR/jira.mjs"


      # ============================================================
      # 3. CHECKOUT + CLEAN AI BRANCH
      # ============================================================

      - name: Checkout ai-agent
        if: steps.prepare.outputs.issue_key != ''
        run: |
          set -euo pipefail

          echo "Preparing ai-agent workspace..."

          git fetch origin --prune

          git checkout -B ai-agent origin/ai-agent

          git reset --hard origin/vishal_test

          git clean -fd

          echo ""
          echo "ai-agent is now based on vishal_test."


      # ============================================================
      # 4. CREATE CODEX TASK FILE
      #
      # IMPORTANT:
      # This happens AFTER git clean -fd so .ai-task.md is not deleted.
      # ============================================================

      - name: Create Codex task instructions
        if: steps.prepare.outputs.issue_key != ''
        env:
          ISSUE_KEY: ${{ steps.prepare.outputs.issue_key }}
          SUMMARY_B64: ${{ steps.prepare.outputs.summary_b64 }}
          DESCRIPTION_B64: ${{ steps.prepare.outputs.description_b64 }}
        shell: bash
        run: |
          set -euo pipefail

          SUMMARY="$(printf '%s' "$SUMMARY_B64" | base64 --decode)"
          DESCRIPTION="$(printf '%s' "$DESCRIPTION_B64" | base64 --decode)"

          cat > .ai-task.md <<EOF
          # Jira Task

          Issue: ${ISSUE_KEY}

          ## Summary

          ${SUMMARY}

          ## Description

          ${DESCRIPTION}

          ## Instructions

          You are the coding agent responsible for implementing this Jira task.

          BEFORE changing any code:

          1. Read AGENTS.md completely.
          2. Inspect the existing project structure.
          3. Identify the exact files, components, services, APIs, database areas, and tests affected.
          4. Understand existing implementation patterns.
          5. Do not invent requirements that are not present in the Jira task or existing project conventions.

          IMPLEMENTATION RULES:

          - Implement the Jira task completely.
          - Implement only what the Jira task requires.
          - Preserve all existing functionality.
          - Do not perform unrelated refactors.
          - Follow the existing architecture and coding conventions.
          - Reuse existing components, utilities, services, and patterns where appropriate.
          - Do not introduce unnecessary dependencies.
          - Respect authentication and authorization.
          - Respect RBAC.
          - Respect tenant isolation and multi-tenant architecture.
          - Do not hardcode secrets, credentials, tokens, or environment-specific values.
          - Do not modify main.
          - Do not modify vishal_test.
          - Work only on the ai-agent branch.
          - Do not create another branch.

          VALIDATION:

          - Run relevant tests.
          - Run linting if available.
          - Run relevant build commands if available.
          - Run type-checking if available.
          - If a test, build, lint, or type-check failure is caused by your changes, fix it.
          - Do not hide, skip, or ignore failures.
          - Do not remove tests merely to make the task pass.

          GIT RULES:

          - Do NOT commit changes.
          - Do NOT push changes.
          - GitHub Actions will commit and push the completed implementation after you finish.

          FINAL RESPONSE:

          Write a clear completion report into claude-output.md with:

          - Summary of changes made.
          - Files created or modified.
          - Tests and validation commands run.
          - Results of tests and build.
          - Any important implementation notes.

          Do not include unnecessary commentary.
          EOF

          echo ""
          echo "Task instructions file (.ai-task.md) created."
          echo ""
          echo "Task:"
          echo "  $ISSUE_KEY"
          echo "Summary:"
          echo "  $SUMMARY"


      # ============================================================
      # 5. RUN GEMINI AGENT — IMPLEMENT + TEST + FIX
      # ============================================================

      - name: Run Gemini Coding Agent
        if: steps.prepare.outputs.issue_key != ''
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_KEY: ${{ steps.prepare.outputs.issue_key }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            echo "Please add GEMINI_API_KEY (from https://aistudio.google.com/) to GitHub repo secrets."
            exit 1
          fi

          echo "Installing Gemini SDK..."
          AGENT_DIR="${RUNNER_TEMP}/gemini-agent"
          mkdir -p "$AGENT_DIR"
          cd "$AGENT_DIR"

          npm init -y >/dev/null 2>&1
          npm install @google/genai >/dev/null 2>&1

          cat > "$AGENT_DIR/agent.mjs" <<'NODE'
          import { GoogleGenAI } from "@google/genai";
          import fs from "node:fs";
          import path from "node:path";
          import { execSync } from "node:child_process";

          const apiKey = process.env.GEMINI_API_KEY;
          const workspace = process.env.GITHUB_WORKSPACE;
          const issueKey = process.env.ISSUE_KEY;

          const ai = new GoogleGenAI({ apiKey });

          // Tool definitions for autonomous coding
          const readFileDeclaration = {
            name: "readFile",
            description: "Read contents of a file relative to workspace root",
            parameters: {
              type: "OBJECT",
              properties: {
                filePath: { type: "STRING", description: "Relative path to file in workspace" }
              },
              required: ["filePath"]
            }
          };

          const writeFileDeclaration = {
            name: "writeFile",
            description: "Write or update contents of a file relative to workspace root",
            parameters: {
              type: "OBJECT",
              properties: {
                filePath: { type: "STRING", description: "Relative path to file in workspace" },
                content: { type: "STRING", description: "Full new content of the file" }
              },
              required: ["filePath", "content"]
            }
          };

          const runCommandDeclaration = {
            name: "runCommand",
            description: "Run a shell command (e.g., npm test, npm run build, git status) in workspace",
            parameters: {
              type: "OBJECT",
              properties: {
                command: { type: "STRING", description: "Shell command line to execute" },
                cwd: { type: "STRING", description: "Optional subdirectory (e.g. frontend, backend)" }
              },
              required: ["command"]
            }
          };

          const listFilesDeclaration = {
            name: "listFiles",
            description: "List files and directories in a given workspace subdirectory",
            parameters: {
              type: "OBJECT",
              properties: {
                dirPath: { type: "STRING", description: "Relative path to directory" }
              },
              required: ["dirPath"]
            }
          };

          function executeTool(name, args) {
            try {
              if (name === "readFile") {
                const fullPath = path.resolve(workspace, args.filePath);
                if (!fullPath.startsWith(workspace)) return { error: "Path traversal forbidden" };
                if (!fs.existsSync(fullPath)) return { error: `File not found: ${args.filePath}` };
                return { content: fs.readFileSync(fullPath, "utf8") };
              }
              if (name === "writeFile") {
                const fullPath = path.resolve(workspace, args.filePath);
                if (!fullPath.startsWith(workspace)) return { error: "Path traversal forbidden" };
                fs.mkdirSync(path.dirname(fullPath), { recursive: true });
                fs.writeFileSync(fullPath, args.content, "utf8");
                return { success: true, filePath: args.filePath };
              }
              if (name === "listFiles") {
                const fullPath = path.resolve(workspace, args.dirPath || ".");
                if (!fullPath.startsWith(workspace)) return { error: "Path traversal forbidden" };
                const items = fs.readdirSync(fullPath, { withFileTypes: true }).map(d => ({
                  name: d.name,
                  isDirectory: d.isDirectory()
                }));
                return { items };
              }
              if (name === "runCommand") {
                const targetCwd = args.cwd ? path.resolve(workspace, args.cwd) : workspace;
                const output = execSync(args.command, {
                  cwd: targetCwd,
                  encoding: "utf8",
                  timeout: 180000,
                  maxBuffer: 10 * 1024 * 1024
                });
                return { stdout: output };
              }
              return { error: `Unknown tool: ${name}` };
            } catch (err) {
              return { error: err.message, stdout: err.stdout, stderr: err.stderr };
            }
          }

          async function main() {
            const taskInstructions = fs.readFileSync(path.join(workspace, ".ai-task.md"), "utf8");
            const agentsMd = fs.existsSync(path.join(workspace, "AGENTS.md"))
              ? fs.readFileSync(path.join(workspace, "AGENTS.md"), "utf8")
              : "";

            const systemPrompt = [
              "You are an elite autonomous AI coding agent pair-programming on this repository.",
              "Your task is to implement the Jira issue: " + issueKey,
              "",
              "RULES AND INVARIANTS FROM AGENTS.MD:",
              agentsMd,
              "",
              "YOUR WORKFLOW:",
              "1. Use listFiles/readFile to inspect existing code and architecture.",
              "2. Modify only the required files using writeFile.",
              "3. NEVER hardcode secrets, ports, or IDs.",
              "4. Run build/tests using runCommand (e.g. 'npm run build' in frontend, 'npm test' in backend) to verify 0 errors.",
              "5. If there are compiler or test errors, fix them using writeFile and re-run.",
              "6. Once completely done and verified, provide a final concise summary of your changes."
            ].join("\n");

            console.log("Starting Gemini autonomous loop...");

            const candidateModels = [
              process.env.GEMINI_MODEL,
              "gemini-3.8-flash",
              "gemini-3.5-flash",
              "gemini-2.5-flash",
              "gemini-3.1-pro-preview"
            ].filter(Boolean);

            let chat = null;
            let response = null;
            let selectedModel = "";

            for (const modelToTry of candidateModels) {
              console.log(`Attempting to connect with model: ${modelToTry}...`);
              try {
                chat = ai.chats.create({
                  model: modelToTry,
                  config: {
                    systemInstruction: systemPrompt,
                    tools: [{
                      functionDeclarations: [
                        readFileDeclaration,
                        writeFileDeclaration,
                        runCommandDeclaration,
                        listFilesDeclaration
                      ]
                    }]
                  }
                });

                response = await chat.sendMessage({
                  message: `Please implement this task completely and verify with tests/build:\n\n${taskInstructions}`
                });

                selectedModel = modelToTry;
                console.log(`Successfully started session with model: ${selectedModel}`);
                break;
              } catch (modelErr) {
                console.log(`Model ${modelToTry} failed: ${modelErr.message}`);
                if (modelErr.message?.includes("429") || modelErr.message?.includes("Quota exceeded") || modelErr.status === 429) {
                  console.log(`Quota exceeded for ${modelToTry}. Trying next fallback model...`);
                }
              }
            }

            if (!chat || !response) {
              throw new Error("All candidate Gemini models failed to initialize. Please check your API key quota at https://aistudio.google.com/rate-limit");
            }

            const maxTurns = 25;
            let turns = 0;
            let finalSummary = "";

            while (turns++ < maxTurns) {
              const functionCalls = response.functionCalls || [];
              if (!functionCalls || functionCalls.length === 0) {
                finalSummary = response.text || "Implementation completed successfully.";
                break;
              }

              const functionResponses = [];
              for (const call of functionCalls) {
                console.log(`[Turn ${turns}] Tool Call: ${call.name}(${JSON.stringify(call.args)})`);
                const result = executeTool(call.name, call.args);
                functionResponses.push({
                  name: call.name,
                  response: result
                });
              }

              response = await chat.sendMessage({
                message: functionResponses
              });
            }

            console.log("Agent finished. Writing output report...");
            fs.writeFileSync(path.join(workspace, "gemini-output.md"), finalSummary, "utf8");
            console.log("Gemini agent completed successfully.");
          }

          main().catch(err => {
            console.error("Agent error:", err);
            process.exit(1);
          });
          NODE

          node "$AGENT_DIR/agent.mjs"


      # ============================================================
      # 6. PREPARE PR BODY + REMOVE AGENT FILES
      # ============================================================

      - name: Prepare PR body
        if: steps.prepare.outputs.issue_key != ''
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing PR information..."

          if [ -f gemini-output.md ]; then
            cp gemini-output.md "$RUNNER_TEMP/pr-body.md"
          elif [ -f claude-output.md ]; then
            cp claude-output.md "$RUNNER_TEMP/pr-body.md"
          elif [ -f codex-output.md ]; then
            cp codex-output.md "$RUNNER_TEMP/pr-body.md"
          else
            cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Gemini AI agent completed the implementation.

          See the commit changes and workflow logs for validation details.
          EOF
          fi

          # These files are workflow-only and must never be committed.
          rm -f .ai-task.md
          rm -f gemini-output.md
          rm -f claude-output.md
          rm -f codex-output.md

          echo "PR body prepared."


      # ============================================================
      # 7. VERIFY IMPLEMENTATION
      # ============================================================

      - name: Verify implementation
        if: steps.prepare.outputs.issue_key != ''
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "       VERIFYING AI IMPLEMENTATION"
          echo "======================================"
          echo ""

          git status --short

          if git diff --quiet && \
             git diff --cached --quiet; then

            echo ""
            echo "ERROR: AI agent produced no tracked code changes."
            exit 1
          fi

          echo ""
          echo "Changes detected."


      # ============================================================
      # 8. COMMIT + PUSH AI BRANCH
      # ============================================================

      - name: Commit and push ai-agent
        if: steps.prepare.outputs.issue_key != ''
        env:
          ISSUE_KEY: ${{ steps.prepare.outputs.issue_key }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ERROR: No staged changes to commit."
            exit 1
          fi

          git commit \
            -m "feat(ai-agent): implement ${ISSUE_KEY}"

          git push origin ai-agent

          echo ""
          echo "ai-agent pushed successfully."


      # ============================================================
      # 9. CREATE PULL REQUEST
      # ============================================================

      - name: Create pull request
        if: steps.prepare.outputs.issue_key != ''
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_KEY: ${{ steps.prepare.outputs.issue_key }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating pull request..."

          EXISTING_PR=$(gh pr list \
            --repo Vishalkeyss/ChamberAI \
            --head ai-agent \
            --base vishal_test \
            --state open \
            --json number,url \
            --jq '.[0]')

          if [ -n "$EXISTING_PR" ]; then
            echo "Existing PR found:"
            echo "$EXISTING_PR"

            PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')

            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          PR_URL=$(gh pr create \
            --repo Vishalkeyss/ChamberAI \
            --base vishal_test \
            --head ai-agent \
            --title "${ISSUE_KEY}: AI implementation" \
            --body-file "$RUNNER_TEMP/pr-body.md")

          echo ""
          echo "PR created:"
          echo "$PR_URL"

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 10. UPDATE JIRA → IN REVIEW + ADD PR COMMENT
      # ============================================================

      - name: Update Jira
        if: steps.prepare.outputs.issue_key != ''
        env:
          ATLASSIAN_MCP_API_KEY: ${{ secrets.ATLASSIAN_MCP_API_KEY }}
          JIRA_CLOUD_ID: "79478d62-55e6-4f8a-9774-9ca35ff386c3"
          ISSUE_KEY: ${{ steps.prepare.outputs.issue_key }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        shell: bash
        run: |
          set -euo pipefail

          MCP_DIR="${RUNNER_TEMP}/mcp-jira-update"

          mkdir -p "$MCP_DIR"
          cd "$MCP_DIR"

          npm init -y >/dev/null 2>&1
          npm install @modelcontextprotocol/client >/dev/null 2>&1

          cat > "$MCP_DIR/update.mjs" <<'NODE'
          import {
            Client,
            StreamableHTTPClientTransport
          } from "@modelcontextprotocol/client";

          const token =
            process.env.ATLASSIAN_MCP_API_KEY;

          const cloudId =
            process.env.JIRA_CLOUD_ID;

          const issueKey =
            process.env.ISSUE_KEY;

          const prUrl =
            process.env.PR_URL;

          const client = new Client(
            {
              name: "github-actions-jira-updater",
              version: "1.0.0"
            },
            {
              versionNegotiation: {
                mode: "auto"
              }
            }
          );

          const transport =
            new StreamableHTTPClientTransport(
              new URL(
                "https://mcp.atlassian.com/v2/mcp"
              ),
              {
                requestInit: {
                  headers: {
                    Authorization:
                      `Bearer ${token}`
                  }
                }
              }
            );

          async function main() {
            await client.connect(transport);

            const tools =
              await client.listTools();

            const transitionTool =
              tools.tools.find(
                tool =>
                  tool.name ===
                  "transitionJiraIssue"
              );

            const commentTool =
              tools.tools.find(
                tool =>
                  tool.name ===
                  "addCommentToJiraIssue"
              );

            if (!transitionTool) {
              throw new Error(
                "transitionJiraIssue unavailable."
              );
            }

            // ------------------------------------------------------
            // ADD PR COMMENT
            // ------------------------------------------------------

            if (commentTool) {
              const schema =
                commentTool.inputSchema ?? {};

              const properties =
                schema.properties ?? {};

              let commentField = null;

              if (
                properties.commentBody
              ) {
                commentField =
                  "commentBody";
              } else if (
                properties.body
              ) {
                commentField =
                  "body";
              } else if (
                properties.comment
              ) {
                commentField =
                  "comment";
              }

              if (commentField) {
                const commentArguments = {
                  cloudId,
                  issueIdOrKey: issueKey
                };

                commentArguments[commentField] =
                  `AI implementation completed.\n\nPull Request:\n${prUrl}`;

                const commentResult =
                  await client.callTool({
                    name:
                      "addCommentToJiraIssue",
                    arguments:
                      commentArguments
                  });

                if (
                  commentResult.isError
                ) {
                  console.log(
                    "Warning: Jira PR comment failed."
                  );
                } else {
                  console.log(
                    "PR URL added to Jira."
                  );
                }
              } else {
                console.log(
                  "Warning: Could not determine Jira comment field."
                );
              }
            } else {
              console.log(
                "Warning: addCommentToJiraIssue unavailable."
              );
            }

            // ------------------------------------------------------
            // MOVE JIRA → IN REVIEW
            // ------------------------------------------------------

            try {
              let reviewTransitionId = "31"; // default fallback

              const transitionsRes = await client.callTool({
                name: "getTransitionsForJiraIssue",
                arguments: {
                  cloudId,
                  issueIdOrKey: issueKey
                }
              }).catch(() => null);

              if (transitionsRes && !transitionsRes.isError) {
                const trJson = (transitionsRes.content ?? []).find(
                  item => item.type === "text" && item.text && item.text.trim().startsWith("{")
                );
                if (trJson) {
                  try {
                    const trData = JSON.parse(trJson.text);
                    const transitionsList = trData.transitions || trData.data?.transitions || [];
                    const reviewTr = transitionsList.find(t =>
                      t.name?.toLowerCase().includes("review") ||
                      t.to?.name?.toLowerCase().includes("review")
                    );
                    if (reviewTr) {
                      reviewTransitionId = reviewTr.id;
                    }
                  } catch (e) {
                    console.log("Could not parse review transitions:", e.message);
                  }
                }
              }

              const result = await client.callTool({
                name: "transitionJiraIssue",
                arguments: {
                  cloudId,
                  issueIdOrKey: issueKey,
                  transition: {
                    id: reviewTransitionId
                  }
                }
              });

              if (result.isError) {
                console.log(
                  "Warning: Failed to move Jira issue to In Review:",
                  JSON.stringify(result.content)
                );
              } else {
                console.log(
                  `${issueKey} moved to In Review (transition id: ${reviewTransitionId}).`
                );
              }
            } catch (err) {
              console.log(
                `Warning transitioning ${issueKey} to In Review: ${err.message}`
              );
            }
          }

          try {
            await main();
          } finally {
            await client
              .close()
              .catch(() => {});
          }
          NODE

          node "$MCP_DIR/update.mjs"


      # ============================================================
      # 11. RECOVER FAILED TASK
      #
      # If implementation failed before a PR exists:
      # Jira → To Do
      #
      # If a PR already exists, leave Jira alone.
      # ============================================================

      - name: Recover Jira task after failure
        if: failure() && steps.prepare.outputs.issue_key != ''
        env:
          ATLASSIAN_MCP_API_KEY: ${{ secrets.ATLASSIAN_MCP_API_KEY }}
          JIRA_CLOUD_ID: "79478d62-55e6-4f8a-9774-9ca35ff386c3"
          ISSUE_KEY: ${{ steps.prepare.outputs.issue_key }}
          GH_TOKEN: ${{ github.token }}
          REPO: "Vishalkeyss/ChamberAI"
          BASE_BRANCH: "vishal_test"
          AI_BRANCH: "ai-agent"
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking whether a PR exists before recovering Jira task..."

          OPEN_PR=$(gh pr list \
            --repo "$REPO" \
            --head "$AI_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number,url \
            --jq '.[0]')

          if [ -n "$OPEN_PR" ]; then
            echo "An open PR exists."
            echo "Leaving Jira issue in its current state."

            echo "$OPEN_PR"

            exit 0
          fi

          echo "No open PR exists."
          echo "Returning $ISSUE_KEY to Jira To Do."

          MCP_DIR="${RUNNER_TEMP}/mcp-jira-recovery"

          mkdir -p "$MCP_DIR"
          cd "$MCP_DIR"

          npm init -y >/dev/null 2>&1
          npm install @modelcontextprotocol/client >/dev/null 2>&1

          cat > "$MCP_DIR/recover.mjs" <<'NODE'
          import {
            Client,
            StreamableHTTPClientTransport
          } from "@modelcontextprotocol/client";

          const token =
            process.env.ATLASSIAN_MCP_API_KEY;

          const cloudId =
            process.env.JIRA_CLOUD_ID;

          const issueKey =
            process.env.ISSUE_KEY;

          const client = new Client(
            {
              name: "github-actions-jira-recovery",
              version: "1.0.0"
            },
            {
              versionNegotiation: {
                mode: "auto"
              }
            }
          );

          const transport =
            new StreamableHTTPClientTransport(
              new URL(
                "https://mcp.atlassian.com/v2/mcp"
              ),
              {
                requestInit: {
                  headers: {
                    Authorization:
                      `Bearer ${token}`
                  }
                }
              }
            );

          async function main() {
            await client.connect(transport);

            const tools =
              await client.listTools();

            const transitionTool =
              tools.tools.find(
                tool =>
                  tool.name ===
                  "transitionJiraIssue"
              );

            const commentTool =
              tools.tools.find(
                tool =>
                  tool.name ===
                  "addCommentToJiraIssue"
              );

            if (!transitionTool) {
              throw new Error(
                "transitionJiraIssue unavailable."
              );
            }

            // ------------------------------------------------------
            // MOVE BACK TO TO DO
            // ------------------------------------------------------

            try {
              let todoTransitionId = "11"; // default fallback

              const transitionsRes = await client.callTool({
                name: "getTransitionsForJiraIssue",
                arguments: {
                  cloudId,
                  issueIdOrKey: issueKey
                }
              }).catch(() => null);

              if (transitionsRes && !transitionsRes.isError) {
                const trJson = (transitionsRes.content ?? []).find(
                  item => item.type === "text" && item.text && item.text.trim().startsWith("{")
                );
                if (trJson) {
                  try {
                    const trData = JSON.parse(trJson.text);
                    const transitionsList = trData.transitions || trData.data?.transitions || [];
                    const todoTr = transitionsList.find(t =>
                      t.name?.toLowerCase().includes("to do") ||
                      t.to?.name?.toLowerCase().includes("to do")
                    );
                    if (todoTr) {
                      todoTransitionId = todoTr.id;
                    }
                  } catch (e) {
                    console.log("Could not parse todo transitions:", e.message);
                  }
                }
              }

              const result = await client.callTool({
                name: "transitionJiraIssue",
                arguments: {
                  cloudId,
                  issueIdOrKey: issueKey,
                  transition: {
                    id: todoTransitionId
                  }
                }
              });

              if (result.isError) {
                console.log(
                  "Warning: Failed to move Jira issue back to To Do:",
                  JSON.stringify(result.content)
                );
              } else {
                console.log(
                  `${issueKey} moved back to To Do (transition id: ${todoTransitionId}).`
                );
              }
            } catch (err) {
              console.log(
                `Warning returning ${issueKey} to To Do: ${err.message}`
              );
            }

            // ------------------------------------------------------
            // ADD FAILURE COMMENT
            // ------------------------------------------------------

            if (commentTool) {
              const schema =
                commentTool.inputSchema ?? {};

              const properties =
                schema.properties ?? {};

              let commentField = null;

              if (
                properties.commentBody
              ) {
                commentField =
                  "commentBody";
              } else if (
                properties.body
              ) {
                commentField =
                  "body";
              } else if (
                properties.comment
              ) {
                commentField =
                  "comment";
              }

              if (commentField) {
                const commentArguments = {
                  cloudId,
                  issueIdOrKey: issueKey
                };

                commentArguments[commentField] =
                  "AI implementation failed before a pull request was created. The Jira task has been returned to To Do so the next scheduled run can retry it.";

                await client.callTool({
                  name:
                    "addCommentToJiraIssue",
                  arguments:
                    commentArguments
                });
              }
            }
          }

          try {
            await main();
          } finally {
            await client
              .close()
              .catch(() => {});
          }
          NODE

          node "$MCP_DIR/recover.mjs"


      # ============================================================
      # 12. FINAL RESULT
      # ============================================================

      - name: Final result
        if: success() && steps.prepare.outputs.issue_key != ''
        env:
          ISSUE_KEY: ${{ steps.prepare.outputs.issue_key }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: |
          echo ""
          echo "======================================"
          echo "       AI TASK COMPLETED"
          echo "======================================"
          echo ""

          echo "Jira task : $ISSUE_KEY"
          echo "Branch    : ai-agent"
          echo "PR        : $PR_URL"
          echo "Target    : vishal_test"
          echo "Jira      : In Review"

          echo ""
          echo "Workflow completed successfully."