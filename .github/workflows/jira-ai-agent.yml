name: Jira AI Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jira-ai-agent
  cancel-in-progress: false

jobs:
  detect-jira-task:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ============================================================
      # STEP 1: SEARCH JIRA
      # ============================================================
      - name: Search Jira through Atlassian Rovo MCP
        id: jira-search
        env:
          ATLASSIAN_MCP_API_KEY: ${{ secrets.ATLASSIAN_MCP_API_KEY }}
          JIRA_CLOUD_ID: "79478d62-55e6-4f8a-9774-9ca35ff386c3"
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "      JIRA AI AGENT - JIRA SEARCH"
          echo "======================================"
          echo ""

          if [ -z "${ATLASSIAN_MCP_API_KEY:-}" ]; then
            echo "ERROR: ATLASSIAN_MCP_API_KEY secret is missing."
            exit 1
          fi

          MCP_DIR="${RUNNER_TEMP}/mcp-jira-client"

          mkdir -p "$MCP_DIR"
          cd "$MCP_DIR"

          echo "Installing MCP client..."

          npm init -y >/dev/null 2>&1
          npm install @modelcontextprotocol/client

          cat > "$MCP_DIR/search-jira.mjs" <<'NODE'
          import {
            Client,
            StreamableHTTPClientTransport
          } from "@modelcontextprotocol/client";

          const url = new URL("https://mcp.atlassian.com/v2/mcp");

          const token = process.env.ATLASSIAN_MCP_API_KEY;
          const cloudId = process.env.JIRA_CLOUD_ID;

          const client = new Client(
            {
              name: "github-actions-jira-agent",
              version: "1.0.0"
            },
            {
              versionNegotiation: {
                mode: "auto"
              }
            }
          );

          const transport = new StreamableHTTPClientTransport(url, {
            requestInit: {
              headers: {
                Authorization: `Bearer ${token}`
              }
            }
          });

          try {
            console.log("Connecting to Atlassian Rovo MCP...");

            await client.connect(transport);

            console.log("MCP connected.");

            console.log(
              "Protocol:",
              client.getNegotiatedProtocolVersion?.() ?? "unknown"
            );

            const tools = await client.listTools();

            const searchTool = tools.tools.find(
              (tool) => tool.name === "searchJiraIssuesUsingJql"
            );

            if (!searchTool) {
              console.error(
                "ERROR: searchJiraIssuesUsingJql was not exposed by MCP."
              );

              console.error(
                "Available tools:",
                tools.tools.map((tool) => tool.name).join(", ")
              );

              process.exit(1);
            }

            console.log(
              "Found MCP tool: searchJiraIssuesUsingJql"
            );

            const result = await client.callTool({
              name: "searchJiraIssuesUsingJql",

              arguments: {
                cloudId,

                jql:
                  'project = KAN AND labels = "ai-ready" AND status = "To Do" ORDER BY created ASC',

                searchResultMode: "issues",

                maxResults: 10,

                fields: [
                  "summary",
                  "status",
                  "labels",
                  "description"
                ],

                responseContentFormat: "markdown",

                view: "evidence"
              }
            });

            if (result.isError) {
              console.error("MCP returned an error.");
              process.exit(1);
            }

            const jsonPart = (result.content ?? []).find(
              (item) =>
                item.type === "text" &&
                item.text.trim().startsWith("{")
            );

            if (!jsonPart) {
              console.error(
                "ERROR: No JSON payload found in MCP response."
              );

              console.error(
                JSON.stringify(result.content, null, 2)
              );

              process.exit(1);
            }

            let response;

            try {
              response = JSON.parse(jsonPart.text);
            } catch (error) {
              console.error(
                "ERROR: MCP returned invalid JSON."
              );

              console.error(jsonPart.text);

              process.exit(1);
            }

            const issues =
              response?.issues ??
              response?.data?.issues ??
              [];

            console.log("");
            console.log("======================================");
            console.log("          JIRA TASK SEARCH");
            console.log("======================================");

            console.log(`Tasks found: ${issues.length}`);

            # --------------------------------------------------------
            # NO TASK FOUND
            # --------------------------------------------------------
            if (issues.length === 0) {
              console.log("");
              console.log(
                "No ai-ready Jira tasks are currently waiting."
              );

              console.log(
                "Workflow will exit without making any code changes."
              );

              const fs = await import("node:fs");

              fs.appendFileSync(
                process.env.GITHUB_OUTPUT,
                "task_found=false\n"
              );

              process.exit(0);
            }

            # --------------------------------------------------------
            # TASK FOUND
            # --------------------------------------------------------
            const issue = issues[0];

            if (!issue.key) {
              console.error(
                "ERROR: Jira issue key is missing."
              );

              process.exit(1);
            }

            console.log(
              `Processing Jira issue: ${issue.key}`
            );

            const fs = await import("node:fs");

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `issue_key=${issue.key}\n`
            );

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              "task_found=true\n"
            );

            console.log("");
            console.log("======================================");
            console.log("            JIRA TASK FOUND");
            console.log("======================================");

            console.log(
              `Issue: ${issue.key ?? "unknown"}`
            );

            console.log(
              `Summary: ${
                issue.fields?.summary ?? "unknown"
              }`
            );

            console.log(
              `Status: ${
                issue.fields?.status?.name ?? "unknown"
              }`
            );

            console.log(
              `Labels: ${
                (issue.fields?.labels ?? []).join(", ") ||
                "none"
              }`
            );

            console.log("");
            console.log("Description:");

            console.log(
              issue.fields?.description ??
              "No description"
            );

            console.log("");
            console.log("======================================");
            console.log("       READY FOR PROCESSING");
            console.log("======================================");

          } finally {
            await client.close().catch(() => {});
          }
          NODE

          node "$MCP_DIR/search-jira.mjs"

          echo ""
          echo "======================================"
          echo "       JIRA SEARCH COMPLETED"
          echo "======================================"

      # ============================================================
      # STEP 2: CHECK AI AGENT BRANCH LOCK
      # ============================================================
      - name: Check AI agent branch lock
        id: branch-lock
        if: steps.jira-search.outputs.task_found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_KEY: ${{ steps.jira-search.outputs.issue_key }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "       AI AGENT BRANCH LOCK"
          echo "======================================"
          echo ""

          echo "Jira issue: $ISSUE_KEY"
          echo ""
          echo "Checking:"
          echo "  Head: ai-agent"
          echo "  Base: vishal_test"
          echo ""

          PR_RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Vishalkeyss/ChamberAI/pulls?state=open&base=vishal_test&head=Vishalkeyss:ai-agent&per_page=10")

          PR_COUNT=$(echo "$PR_RESPONSE" | jq 'length')

          echo "Open AI agent PRs: $PR_COUNT"

          if [ "$PR_COUNT" -gt 0 ]; then
            echo ""
            echo "======================================"
            echo "          AI AGENT IS BUSY"
            echo "======================================"
            echo ""

            echo "An open ai-agent → vishal_test PR already exists."

            echo "The new Jira task will NOT be processed."

            echo ""
            echo "Existing PR(s):"

            echo "$PR_RESPONSE" | jq -r \
              '.[] | "PR #\(.number): \(.title) - \(.html_url)"'

            echo ""

            exit 0
          fi

          echo ""
          echo "======================================"
          echo "          AI AGENT IS FREE"
          echo "======================================"
          echo ""

          echo "No open ai-agent → vishal_test PR found."

          echo "Task can proceed."

          echo ""

          echo "Branch lock passed successfully."

      # ============================================================
      # STEP 3: PHASE 3 COMPLETE
      # ============================================================
      - name: Phase 3 checkpoint
        if: steps.jira-search.outputs.task_found == 'true'
        env:
          ISSUE_KEY: ${{ steps.jira-search.outputs.issue_key }}
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       PHASE 3 CHECKPOINT"
          echo "======================================"
          echo ""

          echo "Jira issue: $ISSUE_KEY"
          echo "Branch: ai-agent"
          echo "PR target: vishal_test"
          echo ""

          echo "Jira task detected."
          echo "AI agent branch lock passed."
          echo ""

          echo "READY FOR NEXT PHASE:"
          echo "  Jira → In Progress"
          echo "  Checkout vishal_test"
          echo "  Prepare ai-agent"
          echo "  Start AI implementation"
          echo ""

          echo "======================================"
          echo "       PHASE 3 COMPLETE"
          echo "======================================"