name: Jira AI Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  detect-jira-task:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Search Jira through Atlassian Rovo MCP
        env:
          ATLASSIAN_MCP_API_KEY: ${{ secrets.ATLASSIAN_MCP_API_KEY }}
          JIRA_CLOUD_ID: "79478d62-55e6-4f8a-9774-9ca35ff386c3"
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "      JIRA AI AGENT - JIRA SEARCH"
          echo "======================================"
          echo ""

          if [ -z "${ATLASSIAN_MCP_API_KEY:-}" ]; then
            echo "ERROR: ATLASSIAN_MCP_API_KEY secret is missing."
            exit 1
          fi

          MCP_DIR="${RUNNER_TEMP}/mcp-jira-client"
          mkdir -p "$MCP_DIR"
          cd "$MCP_DIR"

          echo "Installing MCP client..."
          npm init -y >/dev/null 2>&1
          npm install @modelcontextprotocol/client

          cat > "$MCP_DIR/search-jira.mjs" <<'NODE'
          import {
            Client,
            StreamableHTTPClientTransport
          } from "@modelcontextprotocol/client";

          const url = new URL("https://mcp.atlassian.com/v2/mcp");
          const token = process.env.ATLASSIAN_MCP_API_KEY;
          const cloudId = process.env.JIRA_CLOUD_ID;

          const client = new Client(
            {
              name: "github-actions-jira-agent",
              version: "1.0.0"
            },
            {
              versionNegotiation: {
                mode: "auto"
              }
            }
          );

          const transport = new StreamableHTTPClientTransport(url, {
            requestInit: {
              headers: {
                Authorization: `Bearer ${token}`
              }
            }
          });

          try {
            console.log("Connecting to Atlassian Rovo MCP...");

            await client.connect(transport);

            console.log("MCP connected.");

            console.log(
              "Protocol:",
              client.getNegotiatedProtocolVersion?.() ?? "unknown"
            );

            const tools = await client.listTools();

            const searchTool = tools.tools.find(
              (tool) => tool.name === "searchJiraIssuesUsingJql"
            );

            if (!searchTool) {
              console.error(
                "ERROR: searchJiraIssuesUsingJql was not exposed by MCP."
              );

              console.error(
                "Available tools:",
                tools.tools.map((tool) => tool.name).join(", ")
              );

              process.exit(1);
            }

            console.log(
              "Found MCP tool: searchJiraIssuesUsingJql"
            );

            const result = await client.callTool({
              name: "searchJiraIssuesUsingJql",

              arguments: {
                cloudId,

                jql:
                  'project = KAN AND labels = "ai-ready" AND status = "To Do" ORDER BY created ASC',

                searchResultMode: "issues",

                maxResults: 10,

                fields: [
                  "summary",
                  "status",
                  "labels",
                  "description"
                ],

                responseContentFormat: "markdown",

                view: "evidence"
              }
            });

            const textParts = (result.content ?? [])
            .filter((item) => item.type === "text")
            .map((item) => item.text);

            if (result.isError) {
            console.error("MCP returned an error.");
            process.exit(1);
            }

            const rawResponse = textParts.join("\n").trim();

            let response;

            try {
            response = JSON.parse(rawResponse);
            } catch (error) {
            console.error("ERROR: MCP returned invalid JSON.");
            console.error(rawResponse);
            process.exit(1);
            }

            const issues = response?.data?.issues ?? [];

            console.log("");
            console.log("======================================");
            console.log("          JIRA TASK SEARCH");
            console.log("======================================");

            console.log(`Tasks found: ${issues.length}`);

            if (issues.length === 0) {
            console.log("");
            console.log("No ai-ready Jira tasks are currently waiting.");
            console.log("Workflow will exit without making any code changes.");
            process.exit(0);
            }

            const issue = issues[0];

            console.log("");
            console.log("======================================");
            console.log("            JIRA TASK FOUND");
            console.log("======================================");

            console.log(`Issue: ${issue.key ?? "unknown"}`);
            console.log(`Summary: ${issue.fields?.summary ?? "unknown"}`);
            console.log(`Status: ${issue.fields?.status?.name ?? "unknown"}`);
            console.log(
            `Labels: ${(issue.fields?.labels ?? []).join(", ") || "none"}`
            );

            console.log("");
            console.log("Description:");
            console.log(issue.fields?.description ?? "No description");

            console.log("");
            console.log("======================================");
            console.log("       READY FOR PROCESSING");
            console.log("======================================");

          } finally {
            await client.close().catch(() => {});
          }
          NODE

          node "$MCP_DIR/search-jira.mjs"

          echo ""
          echo "======================================"
          echo "       JIRA SEARCH COMPLETED"
          echo "======================================"
